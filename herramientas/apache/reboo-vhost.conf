# ======================================================================
#  Apache para Re-Boo (XAMPP en Windows)
#
#  Por qué: el servidor "php -S" atiende de a un pedido por vez. Con varias
#  personas caminando en el mundo abierto se satura. Apache atiende muchos
#  a la vez. El proyecto funciona con las dos formas.
#
#  Pasos (cambiá la ruta si tu proyecto está en otra carpeta):
#   1. Detené "php -S" y el MySQL de XAMPP si lo tuvieras prendido.
#   2. En C:\xampp\apache\conf\httpd.conf comprobá que:
#        - estén sin "#" las líneas  LoadModule rewrite_module  y
#          Include conf/extra/httpd-vhosts.conf
#        - agregues, junto al "Listen 80", la línea:  Listen 8080
#   3. Copiá el bloque de abajo al final de
#        C:\xampp\apache\conf\extra\httpd-vhosts.conf
#   4. Panel de XAMPP: Apache -> Start (MySQL80 ya corre como servicio de Windows).
#   5. Entrá a  http://127.0.0.1:8080/DraftDerMauer/
#
#  Si el puerto 8080 está ocupado, usá otro (8081, 8090...) en el Listen y en el VirtualHost.
# ======================================================================
<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot "C:/Re-Boo/Re-Boo_Project-main"
    <Directory "C:/Re-Boo/Re-Boo_Project-main">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
